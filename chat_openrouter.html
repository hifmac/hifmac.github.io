<style>

:13px}.thread-delete{position:absolute;right:4px;top:4px;width:30px;height:30px;display:none}.thread:hover .thread-delete,.thread.active .thread-delete{display:flex}.empty-search{font-size:12px;color:#888;line-height:1.7;padding:13px}.sidebar-bottom{border-top:1px solid #2c2c2c;padding-top:10px}.sidebar-bottom .nav-btn{color:#d8d8d8}.storage-info{font-size:11px;color:#777;padding:6px 13px 1px}
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative;background:var(--bg)}.topbar{height:62px;flex:none;display:flex;align-items:center;gap:12px;padding:0 22px}.top-model{display:flex;align-items:center;gap:7px;background:transparent;border:0;border-radius:9px;color:#ddd;font-size:16px;font-weight:650;max-width:70%;padding:10px;text-align:left}.top-model:hover{background:#2b2b2b}.top-model span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.muted-arrow{color:#aaa}.top-spacer{flex:1}.connection{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);white-space:nowrap}.dot{width:7px;height:7px;border-radius:50%;background:#777}.dot.ready{background:#64c39c}.mobile-only{display:none}.conversation{min-height:0;flex:1;overflow-y:auto;overscroll-behavior:contain;scrollbar-color:#4a4a4a transparent;scrollbar-width:thin}.messages{width:min(100%,870px);padding:18px 27px 40px;margin:auto;display:flex;flex-direction:column;gap:34px;min-height:100%}.message{display:flex;flex-direction:column;gap:8px;max-width:100%;min-width:0}.message.user{align-items:flex-end}.message-content{white-space:normal;line-height:1.8;font-size:15px;overflow-wrap:anywhere;min-width:0}.message.user .message-content{max-width:min(84%,680px);background:#303030;padding:10px 17px;border-radius:21px;line-height:1.65;white-space:pre-wrap}.assistant-head{display:flex;align-items:center;gap:9px;color:#c9c9c9;font-weight:650;font-size:13px;margin-bottom:3px}.assistant-logo{width:26px;height:26px;border-radius:50%;border:1px solid #787878;display:grid;place-items:center;font-size:15px}.message.assistant .message-content{padding:0 2px}.message-content p{margin:0 0 12px}.message-content p:last-child{margin-bottom:0}.message-content h2,.message-content h3,.message-content h4{line-height:1.45;margin:15px 0 8px}.message-content h2{font-size:21px}.message-content h3{font-size:17px}.message-content h4{font-size:15px}.message-content ul,.message-content x-width:460px;color:#969696;font-size:13px;line-height:1.8;margin:0}.composer-section{width:100%;flex:none;padding:8px 28px 18px;background:linear-gradient(0deg,var(--bg) 86%,transparent)}.composer-shell{width:min(100%,830px);margin:auto}.composer{border:1px solid #3d3d3d;background:#303030;border-radius:23px;padding:12px 12px 10px;box-shadow:0 8px 25px #00000016;transition:border .15s}.composer:focus-within{border-color:#5a5a5a}.composer textarea{display:block;border:0;outline:0;resize:none;background:transparent;color:#f7f7f7;width:100%;max-height:225px;min-height:43px;padding:6px 6px 1px;font-size:15px;line-height:1.6;scrollbar-width:thin}.composer textarea::placeholder{color:#aaa}.composer-footer{display:flex;align-items:center;gap:8px;margin-top:7px}.composer-hint{color:#858585;font-size:11px;padding-left:7px}.composer-flex{flex:1}.model-select{background:#353535;color:#dedede;border:1px solid #454545;border-radius:11px;outline:0;min-width:0;max-width:260px;padding:7px 10px;font-size:12px;cursor:pointer}.send-btn{border:0;background:#f1f1f1;color:#242424;border-radius:50%;height:34px;width:34px;display:grid;place-items:center;flex:none}.send-btn:hover:not(:disabled){background:#d8d8d8}.send-btn.stop{background:#ececec}.composer-note{font-size:11px;color:#777;text-align:center;margin-top:10px}.edit-area{border:1px solid #515151;border-radius:15px;padding:10px;background:#303030;width:min(100%,770px)}.edit-area textarea{min-height:94px;max-height:340px;width:100%;resize:vertical;border:0;outline:0;background:transparent;color:white;font-size:14px;line-height:1.65}.edit-actions{display:flex;justify-content:flex-end;gap:8px}.small-btn{border:1px solid #515151;border-radius:20px;background:#393939;color:#eee;padding:7px 14px;font-size:12px}.small-btn.primary{background:#f4f4f4;color:#212121;border-color:#f4f4f4}.small-btn:hover{filter:brightness(1.12)}.status{color:#aaa;font-size:12px;font-style:italic;margin-bottom:8px}.toast{position:fixed;bottom:116px;left:50%;transform:translateX(-50%);background:#0b0b0b;color:#f1f1f1;border:1px solid #4d4d4d;border-radius:12px;box-shadow:0 10px 30px #0008;padding:11px 17px;font-size:13px;z-index:50;max-width:min(90vw,570px);pointer-events:none}.hide{display:none!important}
.dialog{position:fixed;inset:0;margin:auto;width:min(96vw,860px);max-height:min(92dvh,920px);border:1px solid #494949;border-radius:18px;background:#252525;color:var(--text);padding:0;box-shadow:0 30px 90px #000a;overflow:hidden}.dialog::backdrop{background:#000b;backdrop-filter:blur(3px)}.dialog-inner{display:flex;flex-direction:column;max-height:min(calc(92dvh - 2px),918px)}.dialog-head{flex-shrink:0;padding:20px 24px 15px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #3b3b3b}.dialog-head h2{font-size:19px;margin:0}.dialog-scroll{flex:1 1 auto;min-height:0;overflow:auto;padding:20px 24px;scrollbar-width:thin}.dialog-section{margin-bottom:24px}.field-label{display:block;font-size:12px;color:#c9c9c9;font-weight:600;margin:0 0 7px}.input{background:#323232;color:#f2f2f2;outline:none;border:1px solid #4e4e4e;border-radius:9px;width:100%;padding:10px 11px;font-size:13px}.input:focus{border-color:#929292}.input::placeholder{color:#797979}.field-help{font-size:11px;color:#9b9b9b;line-height:1.7;margin-top:7px}.token-line{display:flex;gap:9px;align-items:center}.token-line .input{flex:1}.token-line .icon-btn{border:1px solid #4a4a4a;width:39px;height:39px}.config-heading{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px}.config-heading h3{font-size:14px;margin:0}.model-card{padding:15px;border:1px solid #464646;border-radius:13px;background:#2c2c2c;margin-bottom:12px}.model-title-row{display:flex;gap:9px;align-items:center;margin-bottom:15px}.model-title-row .field{flex:1;min-width:0}.model-title-row .icon-btn{margin-top:19px;color:#c8b0b0}.model-fields{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.model-fields .wide{grid-column:1/-1}.model-fields .field-label{font-weight:500}.dialog-actions{flex-shrink:0;display:flex;justify-content:flex-end;gap:10px;padding:15px 24px;border-top:1px solid #3b3b3b;background:#252525}.action-btn{border-radius:9px;background:#343434;border:1px solid #505050;padding:9px 17px;color:#eee;font-size:13px}.action-btn.primary{background:#f5f5f5;color:#1e1e1e;border-color:#f5f5f5;font-weight:650}.action-btn:hover{filter:brightness(1.08)}.settings-note{border-radius:8px;background:#333;padding:9px 12px;color:#aaa;font-size:11px;line-height:1.6}.menu-backdrop{display:none}
@media(max-width:810px){.sidebar{position:fixed;inset:0 auto 0 0;transform:translateX(-100%);transition:transform .18s;box-shadow:8px 0 26px #0003}.sidebar.open{transform:translateX(0)}.menu-backdrop.open{display:block;position:fixed;inset:0;background:#0009;z-index:9}.mobile-only{display:inline-flex}.topbar{padding:0 13px}.connection span:last-child{display:none}.messages{padding:18px 19px 30px;gap:28px}.composer-section{padding:6px 12px 14px}.composer-note{display:none}.empty-state h1{font-size:23px}.message.user .message-content{max-width:95%}.model-fields{grid-template-columns:repeat(2,minmax(0,1fr))}.dialog-scroll{padding:16px}.dialog-head{padding:17px}.dialog-actions{padding:12px 16px}.thread-delete{display:flex}.composer-hint{display:none}}
@media(max-width:450px){.model-select{max-width:197px}.dialog{width:98vw}.model-fields{grid-template-columns:1fr 1fr;gap:9px}.model-title-row{gap:3px}}
@media(hover:none){.message-actions{opacity:1}}
</style>
</head>
<body>
<div class="app">
  <div id="menuBackdrop" class="menu-backdrop"></div>
  <aside class="sidebar" id="sidebar" aria-label="サイドバー">
    <div class="side-head"><div class="brand"><div class="brand-icon">✳</div><span>Chat</span></div><button class="icon-btn" id="collapseSidebar" title="サイドバーを閉じる" aria-label="サイドバーを閉じる"></button></div>
    <button class="nav-btn" id="newChat"><span id="newIcon"></span><span>新しいチャット</span></button>
    <label class="search-wrap"><span id="searchIcon"></span><input id="searchThreads" placeholder="チャットを検索" aria-label="チャット検索"><span class="kbd">⌘ K</span></label>
    <div class="side-label">チャット</div>
    <nav id="threadList" class="thread-list" aria-label="チャット履歴"></nav>
    <div class="sidebar-bottom"><button class="nav-btn" id="openSettings"><span id="settingsIcon"></span><span>設定</span></button><div class="storage-info" id="storageInfo"></div></div>
  </aside>
  <main class="main">
    <header class="topbar"><button class="icon-btn mobile-only" id="mobileMenu" title="メニュー" aria-label="メニュー"></button><button class="top-model" id="modelHeading"><span id="topModelName"></span><span id="chevronIcon" class="muted-arrow"></span></button><div class="top-spacer"></div><div class="connection"><span id="connectionDot" class="dot"></span><span id="connectionText">APIキー未設定</span></div></header>
    <section class="conversation" id="conversation" aria-label="会話"><div id="messageList" class="messages"></div></section>
    <section class="composer-section"><div class="composer-shell"><div class="composer"><textarea id="promptInput" rows="1" placeholder="メッセージを入力" aria-label="メッセージを入力"></textarea><div class="composer-footer"><span class="composer-hint">Enter で送信 · Shift+Enter で改行</span><span class="composer-flex"></span><select class="model-select" id="composerModel" aria-label="モデル選択"></select><button class="send-btn" id="sendButton" aria-label="送信"></button></div></div><div class="composer-note">回答はAIによって生成されます。重要な情報は確認してください。</div></div></section>
  </main>
</div>
<dialog class="dialog" id="settingsDialog" aria-label="設定">
  <div class="dialog-inner"><header class="dialog-head"><h2>設定</h2><button class="icon-btn" id="closeSettings" aria-label="閉じる"></button></header><div class="dialog-scroll">
    <section class="dialog-section"><label class="field-label" for="apiToken">OpenRouter API Token</label><div class="token-line"><input class="input" type="password" id="apiToken" placeholder="sk-or-v1-..." autocomplete="off" spellcheck="false"><button class="icon-btn" id="toggleToken" title="トークンを表示 / 非表示" aria-label="トークン表示切替"></button></div><div class="field-help">トークンはページ内のメモリだけに保持します。localStorageには保存されず、リロードで消えます。APIリクエスト時のみOpenRouterへ送信します。</div></section>
    <section class="dialog-section"><div class="config-heading"><h3>モデル一覧</h3><button class="small-btn" id="addModel">＋ モデル追加</button></div><div id="modelCards"></div><div class="settings-note">空欄のパラメータはAPIリクエストに含めません。system-prompt も空欄なら system メッセージを送信しません。</div></section>
  </div><footer class="dialog-actions"><button class="action-btn" id="cancelSettings">キャンセル</button><button class="action-btn primary" id="saveSettings">保存</button></footer></div>
</dialog>
<div class="toast hide" id="toast" role="status"></div>
<script>
'use strict';
(() => {
  const STORE_KEY = 'openrouter-chat-singlefile-v1';
  const BUDGET = 4 * 1024 * 1024;
  const ENDPOINT = 'https://openrouter.ai/api/v1/chat/completions';
  const defaults = [
    {name:'openai/gpt-6-luna',systemPrompt:'',topP:'',topK:'',temp:'',minP:''},
    {name:'google/gemini-3.8-flash',systemPrompt:'',topP:'',topK:'',temp:'',minP:''},
    {name:'google/gemma-4-31b-it',systemPrompt:'',topP:'0.95',topK:'64',temp:'1.0',minP:''},
    {name:'deepseek/deepseek-v4.1-flash',systemPrompt:'',topP:'1.0',topK:'',temp:'1.0',minP:''},
    {name:'z-ai/glm-5.3-flash',systemPrompt:'',topP:'0.95',topK:'',temp:'1.0',minP:''}
  ];
  const $ = id => document.getElementById(id);
  const IC = {
    menu:'<path d="M4 7h16M4 12h16M4 17h16"/>',
    plus:'<path d="M12 5v14M5 12h14"/>',
    search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',
    settings:'<path d="M12 2.8v2M12 19.2v2M4.2 4.2l1.5 1.5m12.6 12.6 1.5 1.5M2.8 12h2m14.4 0h2M4.2 19.8l1.5-1.5M18.3 5.7l1.5-1.5"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.8"/>',
    close:'<path d="M6 6l12 12M18 6 6 18"/>',
    chevron:'<path d="m6 9 6 6 6-6"/>',
    send:'<path d="M12 19V5m-6 6 6-6 6 6"/>',
    stop:'<rect x="7" y="7" width="10" height="10" rx="1.5" fill="currentColor" stroke="none"/>',
    edit:'<path d="m15 5 4 4M4 20l4.5-1 10.7-10.7a2.8 2.8 0 0 0-4-4L4.5 15z"/>',
    copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>',
    trash:'<path d="M4 7h16M10 4h4m4 3-1 13H7L6 7M10 10v7m4-7v7"/>',
    eye:'<path d="M2 12s3.8-6 10-6 10 6 10 6-3.8 6-10 6-10-6-10-6Z"/><circle cx="12" cy="12" r="3"/>'
  };
  function icon(name){return `<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">${IC[name]||''}</svg>`;}
  $('collapseSidebar').innerHTML=icon('menu');$('newIcon').innerHTML=icon('plus');$('searchIcon').innerHTML=icon('search');$('settingsIcon').innerHTML=icon('settings');$('mobileMenu').innerHTML=icon('menu');$('chevronIcon').innerHTML=icon('chevron');$('closeSettings').innerHTML=icon('close');$('toggleToken').innerHTML=icon('eye');

  // Only application state is serialized; `apiToken` never enters this object.
  let apiToken = '';
  let threads = [];
  let models = structuredClone(defaults);
  let selectedModel = models[0].name;
  let activeId = null;
  let editingId = null;
  let configDraft = null;
  let generation = null;
  let toastTimer;
  let renderQueued = false;
  let storageBlocked = false;
  const makeId = () => (globalThis.crypto?.randomUUID?.() || `${Date.now()}-${Math.random().toString(36).slice(2)}`);

  function message(text){
    const el=$('toast');el.textContent=text;el.classList.remove('hide');
    clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.add('hide'),3600);
  }
  function estimatedBytes(s){return Math.max(new Blob([s]).size,s.length*2);}
  function cleanState(){return {version:1,models,selectedModel,activeId,threads:threads.map(t=>({...t,messages:t.messages.filter(m=>m.status!=='pending')}))};}
  function saveState(){
    if(storageBlocked)return;
    let snapshot=cleanState();let json=JSON.stringify(snapshot);let pruned=0;
    while(estimatedBytes(json)>BUDGET && threads.length){
      const oldest=threads.slice().sort((a,b)=>a.updatedAt-b.updatedAt)[0];
      threads=threads.filter(t=>t.id!==oldest.id);
      if(activeId===oldest.id)activeId=null;
      snapshot=cleanState();json=JSON.stringify(snapshot);pruned++;
    }
    try{
      localStorage.setItem(STORE_KEY,json);
    }catch(e){
      while(threads.length){
        const oldest=threads.slice().sort((a,b)=>a.updatedAt-b.updatedAt)[0];
        threads=threads.filter(t=>t.id!==oldest.id);
        if(activeId===oldest.id)activeId=null;
        pruned++;json=JSON.stringify(cleanState());
        try{localStorage.setItem(STORE_KEY,json);break;}catch(err){/* Continue evicting; storage may be unavailable. */}
      }
      if(!threads.length){try{localStorage.setItem(STORE_KEY,JSON.stringify(cleanState()));}catch(err){storageBlocked=true;message('localStorageを利用できません。会話はこのページ内のみ保持されます。');}}
    }
    if(pruned){message(`容量制限により古いチャット${pruned}件を削除しました。`);renderSidebar();renderMessages();}
    $('storageInfo').textContent=`保存容量 約 ${(estimatedBytes(json)/1024/1024).toFixed(2)} / 4.00 MiB`;
  }
  function loadState(){
    try{
      const saved=JSON.parse(localStorage.getItem(STORE_KEY)||'null');
      if(!saved||saved.version!==1)return;
      if(Array.isArray(saved.models)&&saved.models.length){
        const restored=saved.models.filter(x=>x && typeof x.name==='string' && x.name.trim()).map(x=>({name:String(x.name),systemPrompt:String(x.systemPrompt||''),topP:String(x.topP??''),topK:String(x.topK??''),temp:String(x.temp??''),minP:String(x.minP??'')}));
        if(restored.length)models=restored;
      }
      if(Array.isArray(saved.threads))threads=saved.threads.filter(t=>t&&typeof t.id==='string'&&Array.isArray(t.messages)).map(t=>({...t,messages:t.messages.filter(m=>m&&['user','assistant'].includes(m.role)&&typeof m.content==='string'&&m.status!=='pending')}));
      activeId=threads.some(t=>t.id===saved.activeId)?saved.activeId:null;
      selectedModel=models.some(m=>m.name===saved.selectedModel)?saved.selectedModel:models[0].name;
    }catch(e){message('保存データの読み込みに失敗しました。');}
  }
  loadState();

      const h=l.match(/^(#{1,3})\s+(.*)$/);if(h){flushPara();flushList();out.push(`<h${h[1].length+1}>${inlineMarkdown(h[2])}</h${h[1].length+1}>`);continue;}

    }
  }
  function commitSettings(){
    try{validateModels(configDraft);models=structuredClone(configDraft);apiToken=$('apiToken').value.trim();if(!models.some(m=>m.name===selectedModel))selectedModel=models[0].name;closeSettings();renderAll();saveState();message('設定を反映しました（API Tokenは保存しません）。');}
    catch(e){message(e.message);}
  }
  $('openSettings').addEventListener('click',openSettings);$('modelHeading').addEventListener('click',openSettings);
  $('closeSettings').onclick=closeSettings;$('cancelSettings').onclick=closeSettings;$('saveSettings').onclick=commitSettings;
  $('settingsDialog').addEventListener('click',e=>{if(e.target===$('settingsDialog'))closeSettings();});
  $('settingsDialog').addEventListener('close',()=>{configDraft=null;});
  $('addModel').onclick=()=>{configDraft.push({name:'',systemPrompt:'',topP:'',topK:'',temp:'',minP:''});renderConfigModels();};
  $('toggleToken').onclick=()=>$('apiToken').type=$('apiToken').type==='password'?'text':'password';
  $('newChat').onclick=newChat;$('searchThreads').addEventListener('input',renderSidebar);
  $('sendButton').onclick=sendMessage;$('promptInput').addEventListener('input',()=>{autoSize();updateSendButton();});
  $('promptInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();sendMessage();}});
  $('composerModel').addEventListener('change',e=>selectModel(e.target.value));
  $('mobileMenu').onclick=()=>{$('sidebar').classList.add('open');$('menuBackdrop').classList.add('open');};
  $('collapseSidebar').onclick=closeMobile;$('menuBackdrop').onclick=closeMobile;
  document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if(window.innerWidth<=810){$('sidebar').classList.add('open');$('menuBackdrop').classList.add('open');}$('searchThreads').focus();}if(e.key==='Escape')closeMobile();});
  window.addEventListener('beforeunload',()=>{generation?.controller.abort();});
  renderAll();saveState();autoSize();
})();
</script>
</body>
</html>
